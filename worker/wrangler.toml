name = "wahr-oder-falsch"
main = "worker.js"
compatibility_date = "2026-09-01"

# Pro Besucher (IP): 20 Anfragen pro Minute – ein Klick auf alle 9 Modelle sind 9
[[ratelimits]]
name = "PRO_IP"
namespace_id = "3003"
  [ratelimits.simple]
  limit = 20
  period = 60

# Alle Besucher zusammen: 300 Anfragen pro Minute
[[ratelimits]]
name = "GESAMT"
namespace_id = "3004"
  [ratelimits.simple]
  limit = 300
  period = 60

# Log der eingegebenen Sätze (ohne IP), Löschung nach 90 Tagen per Cron
[[d1_databases]]
binding = "LOG"
database_name = "wahr-oder-falsch-log"
database_id = "e13e6919-8865-48c8-94ea-3b17c171a154"

[triggers]
crons = ["17 3 * * *"]
